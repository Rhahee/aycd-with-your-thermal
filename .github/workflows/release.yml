name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run smoke tests
        run: dotnet run --project tests/PrintToDo.Smoke.csproj -c Release
      - name: Build installer and update package
        shell: pwsh
        run: .\installer\Build-Installer.ps1 -Ci
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $installer = "installer/output/All-You-Can-Do-with-Your-Thermal-Printer-Setup-$version-win-x64.exe"
          $update = "installer/output/AYCD-Printer-$version-win-x64.zip"
          $notesPath = "release-notes/$env:GITHUB_REF_NAME.md"
          if (-not (Test-Path -LiteralPath $notesPath)) { throw "Catatan rilis tidak ditemukan: $notesPath" }
          $notes = Get-Content -LiteralPath $notesPath -Raw -Encoding utf8
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $installer $update --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Gagal mengganti aset rilis.' }
            gh release edit $env:GITHUB_REF_NAME --target $env:GITHUB_SHA --title "AYCD Printer $version" --notes $notes
          }
          else {
            gh release create $env:GITHUB_REF_NAME $installer $update --verify-tag --title "AYCD Printer $version" --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Gagal menerbitkan rilis.' }
